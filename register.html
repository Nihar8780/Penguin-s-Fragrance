<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create Account | Penguin's Fragrance</title>
  <meta name="description" content="Create a Penguin's Fragrance account to track orders and save your wishlist." />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Playfair+Display:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />

  <link rel="stylesheet" href="css/reset.css" />
  <link rel="stylesheet" href="css/variables.css" />
  <link rel="stylesheet" href="css/typography.css" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/navbar.css" />
  <link rel="stylesheet" href="css/footer.css" />
  <link rel="stylesheet" href="css/checkout.css" />
  <link rel="stylesheet" href="css/auth.css" />
  <link rel="stylesheet" href="css/notifications.css" />
  
  <!-- Vercel Web Analytics -->
  <script src="js/analytics.js"></script>
</head>
<body>

  <!-- ==================== HEADER (minimal) ==================== -->
  <header class="site-header header-solid" id="siteHeader">
    <div class="container">
      <div class="site-header__inner">
        <a class="site-header__logo mx-auto" href="index.html" style="position:static; transform:none;">Penguin's Fragrance</a>
      </div>
    </div>
  </header>

  <main class="container auth-wrapper">
    <div class="auth-card">
      <div class="auth-card__header">
        <h1 class="text-headline-md auth-card__title">Create Account</h1>
        <p class="auth-card__subtitle">Join Penguin's Fragrance to track orders and save favorites.</p>
      </div>

      <form id="registerForm" novalidate>
        <div class="form-row">
          <div class="form-field">
            <label class="form-label-brand" for="registerName">Full Name</label>
            <input type="text" id="registerName" class="form-control-brand" required />
          </div>
        </div>
        <div class="form-row">
          <div class="form-field">
            <label class="form-label-brand" for="registerEmail">Email Address</label>
            <input type="email" id="registerEmail" class="form-control-brand" required />
          </div>
        </div>
        <div class="form-row">
          <div class="form-field">
            <label class="form-label-brand" for="registerPassword">Password</label>
            <input type="password" id="registerPassword" class="form-control-brand" minlength="6" required />
          </div>
        </div>
        <div class="form-row">
          <div class="form-field">
            <label class="form-label-brand" for="registerPasswordConfirm">Confirm Password</label>
            <input type="password" id="registerPasswordConfirm" class="form-control-brand" required />
          </div>
        </div>
        <button type="submit" class="btn-brand btn-brand-primary btn-brand-block">Create Account</button>
      </form>

      <p class="auth-card__footer">
        Already have an account? <a href="login.html">Sign in</a>
      </p>

      <p class="auth-demo-notice">
        Demo account system for this project — no real authentication backend is connected. Do not use a real password.
      </p>
    </div>
  </main>

  <footer class="site-footer mt-5">
    <div class="container">
      <div class="site-footer__bottom" style="border-top:none;">
        <p class="site-footer__copyright">© <span id="footerYear">2025</span> Penguin's Fragrance. All rights reserved.</p>
      </div>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/products.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/wishlist.js"></script>
  <script src="js/notifications.js"></script>
  <script src="js/navigation.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/main.js"></script>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      if (getCurrentUser()) {
        window.location.href = "account.html";
        return;
      }

      const form = document.getElementById("registerForm");
      form.addEventListener("submit", (e) => {
        e.preventDefault();

        const fullName = document.getElementById("registerName").value.trim();
        const email = document.getElementById("registerEmail").value.trim();
        const password = document.getElementById("registerPassword").value;
        const confirmPassword = document.getElementById("registerPasswordConfirm").value;

        if (!fullName || !email || !password) {
          showToast("Please fill in all fields.", "error");
          return;
        }

        if (password.length < 6) {
          showToast("Password must be at least 6 characters.", "error");
          return;
        }

        if (password !== confirmPassword) {
          showToast("Passwords do not match.", "error");
          return;
        }

        const result = registerUser({ fullName, email, password });

        if (!result.success) {
          showToast(result.message, "error");
          return;
        }

        showToast(result.message, "success");
        window.location.href = "account.html";
      });
    });
  </script>

</body>
</html>
