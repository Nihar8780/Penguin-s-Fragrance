<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In | Penguin's Fragrance</title>
  <meta name="description" content="Sign in to your Penguin's Fragrance account." />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Playfair+Display:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />

  <link rel="stylesheet" href="css/reset.css" />
  <link rel="stylesheet" href="css/variables.css" />
  <link rel="stylesheet" href="css/typography.css" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/navbar.css" />
  <link rel="stylesheet" href="css/footer.css" />
  <link rel="stylesheet" href="css/checkout.css" />
  <link rel="stylesheet" href="css/auth.css" />
  <link rel="stylesheet" href="css/notifications.css" />
  
  <!-- Vercel Web Analytics -->
  <script src="js/analytics.js"></script>
</head>
<body>

  <!-- ==================== HEADER (minimal) ==================== -->
  <header class="site-header header-solid" id="siteHeader">
    <div class="container">
      <div class="site-header__inner">
        <a class="site-header__logo mx-auto" href="index.html" style="position:static; transform:none;">Penguin's Fragrance</a>
      </div>
    </div>
  </header>

  <main class="container auth-wrapper">
    <div class="auth-card">
      <div class="auth-card__header">
        <h1 class="text-headline-md auth-card__title">Sign In</h1>
        <p class="auth-card__subtitle">Welcome back. Enter your details to continue.</p>
      </div>

      <form id="loginForm" novalidate>
        <div class="form-row">
          <div class="form-field">
            <label class="form-label-brand" for="loginEmail">Email Address</label>
            <input type="email" id="loginEmail" class="form-control-brand" required />
          </div>
        </div>
        <div class="form-row">
          <div class="form-field">
            <label class="form-label-brand" for="loginPassword">Password</label>
            <input type="password" id="loginPassword" class="form-control-brand" required />
          </div>
        </div>
        <button type="submit" class="btn-brand btn-brand-primary btn-brand-block">Sign In</button>
      </form>

      <p class="auth-card__footer">
        Don't have an account? <a href="register.html">Create one</a>
      </p>

      <p class="auth-demo-notice">
        Demo account system for this project — no real authentication backend is connected.
      </p>
    </div>
  </main>

  <footer class="site-footer mt-5">
    <div class="container">
      <div class="site-footer__bottom" style="border-top:none;">
        <p class="site-footer__copyright">© <span id="footerYear">2025</span> Penguin's Fragrance. All rights reserved.</p>
      </div>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/products.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/wishlist.js"></script>
  <script src="js/notifications.js"></script>
  <script src="js/navigation.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/main.js"></script>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      // Already signed in? Skip straight to account.
      if (getCurrentUser()) {
        window.location.href = "account.html";
        return;
      }

      const form = document.getElementById("loginForm");
      form.addEventListener("submit", (e) => {
        e.preventDefault();

        const email = document.getElementById("loginEmail").value;
        const password = document.getElementById("loginPassword").value;

        const result = loginUser(email, password);

        if (!result.success) {
          showToast(result.message, "error");
          return;
        }

        showToast(result.message, "success");

        const redirectTo = new URLSearchParams(window.location.search).get("redirect");
        window.location.href = redirectTo && redirectTo !== "login.html" ? redirectTo : "account.html";
      });
    });
  </script>

</body>
</html>
